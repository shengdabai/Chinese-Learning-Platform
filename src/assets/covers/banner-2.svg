<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">中文学堂课程横幅 2</title>
  <!-- Tokens: role -> Tailwind default palette value (teal/blue/white, same palette as the site UI) -->
  <style>
    :root {
      --cover-bg-from: #1d4ed8;   /* blue-700 */
      --cover-bg-to: #115e59;   /* teal-800 */
      --cover-fg: #ffffff;   /* white */
      --cover-accent: #99f6e4;   /* teal-200 */
      --cover-pill-bg: #ffffff;   /* white */
      --cover-pill-fg: #134e4a;   /* teal-900 */
      --cover-shape-strong: 0.9;
      --cover-shape-mid: 0.28;
      --cover-shape-soft: 0.14;
      --cover-font: "PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
    }
    .bg-from { stop-color: var(--cover-bg-from); }
    .bg-to { stop-color: var(--cover-bg-to); }
    .fg { fill: var(--cover-fg); font-family: var(--cover-font); font-weight: 700; }
    .pill { fill: var(--cover-pill-bg); }
    .pill-text { fill: var(--cover-pill-fg); font-family: var(--cover-font); font-weight: 700; }
    .cat { fill: var(--cover-accent); font-family: var(--cover-font); font-weight: 600; }
    .s-soft { fill: var(--cover-fg); fill-opacity: var(--cover-shape-soft); }
    .s-mid { fill: var(--cover-fg); fill-opacity: var(--cover-shape-mid); }
    .s-strong { fill: var(--cover-fg); fill-opacity: var(--cover-shape-strong); }
    .s-accent { fill: var(--cover-accent); }
    .l-mid { fill: none; stroke: var(--cover-fg); stroke-opacity: var(--cover-shape-mid); stroke-width: 6; stroke-linecap: round; }
    .l-strong { fill: none; stroke: var(--cover-accent); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop class="bg-from" offset="0"/>
      <stop class="bg-to" offset="1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g>
    <path class="l-mid" d="M0 760 q200 -220 400 0 t400 0 t400 0 t400 0"/><path class="l-mid" d="M0 640 q200 -220 400 0 t400 0 t400 0 t400 0"/><circle class="s-soft" cx="1300" cy="230" r="260"/><circle class="s-accent" cx="1300" cy="230" r="60"/>
  </g>
</svg>
